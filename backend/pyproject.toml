[project]
name = "jarvis-dashboard"
version = "0.1.0"
description = "Wall display and voice front-end for the household Pi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
voice = [
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "websockets>=12",
]
# Speech recognition and speech synthesis are binaries, not Python packages:
# whisper.cpp (`whisper-cli`) and Piper (`piper`) both have to be on PATH. The
# models they load live in the state directory — see the README.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
