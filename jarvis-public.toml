# Jarvis, public edition — the config for abfahrt.anishsheela.com.
#
# Unlike jarvis.toml this file is COMMITTED, because it holds no secrets and no
# home address: the public service is stateless and keyless, and the visitor's
# own location lives in their browser, never here. Read at startup by
# backend/jarvis/config.py, exactly like the wall's config, so tuning any of
# these is a service restart rather than a code change.
#
#   JARVIS_CONFIG=/path/to/jarvis-public.toml uvicorn jarvis.public.app:app

[general]
timezone = "Europe/Berlin"

# The wall forces IPv4 because the Pi has IPv6 disabled at the kernel and
# v6.bvg.transport.rest publishes an AAAA record. The VPS has working IPv6, so
# there is nothing to route around here.
force_ipv4 = false

[public]
# Germany, as a rectangle. Enforced on every request, not only in the address
# picker: the URL parameters accept coordinates directly, and without this the
# service is a free worldwide proxy for someone else's API quota.
#
# Inside Berlin and Brandenburg departures come from BVG first, which alone
# carries the disruption notices; everywhere else from Transitous. That split
# is in code (public/limits.py, VBB), not here, because it is a fact about
# where BVG has stops rather than a setting.
bbox = { south = 47.27, north = 55.06, west = 5.87, east = 15.04 }

# How many stops around the address get a board, and how far to look. Three is
# the number that covers a Berlin address without turning the page into a
# timetable: from one real Berlin address it finds the U-Bahn, the bus stop
# on the corner and the S-Bahn, which is three of the four boards that were
# hand-written into jarvis.toml.
# How many BOARDS the departures tile carries, counting the pooled bus block as
# one of them. Three is what the tile's height was measured for; a fourth is
# drawn with its last row cropped off the bottom.
nearby_stops = 3

# How many stops actually get FETCHED. More than get a board, because whether a
# stop deserves one depends on the routes it runs and that is only knowable
# after asking: from one address the second and third nearest stops run the same
# two trams as the first, and without the surplus the U-Bahn six hundred metres
# away is never even looked at. The extras cost a few upstream calls on a cache
# miss and nothing on a hit.
nearby_candidates = 5
nearby_radius_m = 900

# With no train inside the radius, these are searched in turn for the nearest
# station, which then competes for a board like any other stop. A village's
# bus runs three times a day and its station is how anyone actually leaves.
nearby_rail_radii_m = [2500, 6000]

# Straight-line metres per minute on foot. The stop's reported distance is
# as-the-crow-flies, so this is already optimistic; the walk is rounded UP for
# the same reason. A board that claims you can make a tram you cannot is worse
# than one that drops it.
walk_metres_per_minute = 80
# The same by bike, shown beside the walk. Never the threshold: the walk is.
cycle_metres_per_minute = 200

# Server-side cache lifetimes, seconds. Coordinates are rounded before they
# become a cache key, so a whole street shares one upstream call.
cache_geocode_seconds = 3600
cache_weather_seconds = 600
cache_departures_seconds = 30
# Stops don't move, and finding a village's station is a wide search.
cache_stops_seconds = 3600

# Per-IP token bucket. Generous for a person, useless for a scraper.
rate_limit_per_minute = 60
# Ceiling on requests in flight upstream at once, across all visitors. Past
# this the service sheds load itself rather than discovering BVG's opinion of
# it the hard way.
max_concurrent_upstream = 8

# ---------------------------------------------------------------------------
# Weather — Open-Meteo, no API key.
#
# The thresholds here are DEFAULTS the page starts from, not the answer. The
# public API returns the forecast facts and the browser decides, because the
# response is cached on rounded coordinates and shared between everyone near
# that rounding — so it cannot carry one visitor's jacket temperature.
# ---------------------------------------------------------------------------
[weather]
api_base = "https://api.open-meteo.com/v1/forecast"
forecast_days = 7
rain_likely_threshold = 40
jacket_below = 14
advice_min_hours = 6

# ---------------------------------------------------------------------------
# BVG departures. No [[departures.boards]] here — there is no configured stop
# to write one for. The boards are built per request from whatever is near the
# visitor's address, and these are the defaults each of them inherits.
# ---------------------------------------------------------------------------
[departures]
api_base = "https://v6.bvg.transport.rest"
# Smaller than the wall's. The wall over-fetches because it refreshes every 30s
# behind one cache on one Pi; here every uncached visitor pays for it three
# stops over, so the window is shorter and the ask is smaller.
duration_minutes = 45
results = 8
# A stop with nothing inside that window shows its next few departures anyway,
# as clock times, up to this far ahead: a village bus that next runs at 15:07,
# or on Monday at 06:33, is an answer; an empty board says nothing runs.
lookahead_hours = 60
lookahead_results = 4
rows = 4
route_length = 3
# The only ordering that survives a stop nobody configured: it sorts by line and
# then destination, reading line numbers the way a person does, and can place a
# terminus that no groups table has ever named — which is every terminus here.
order = "line"
